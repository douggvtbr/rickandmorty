<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rick & Morty - Inicio Pixel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
   <style>
    body {
      font-family: 'Press Start 2P', cursive;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-green-500 selection:text-black">


  <header class="border-b-4 border-green-500 bg-slate-900 p-4 shadow-[0_4px_0_0_#15803d]">
    <div class="max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
      
   
      <div class="flex items-center gap-2">
        <span class="text-green-400 text-xl tracking-tighter">[R&M]</span>
        <h1 class="text-xs sm:text-sm text-green-400 tracking-wider">PORTAL_DB</h1>
      </div>
        <nav id="nav-container" class="flex flex-wrap items-center justify-center gap-3 text-[10px]">
        
       
       
      </nav>

    </div>
  </header>

  <main class="flex-1 max-w-6xl w-full mx-auto px-4 py-8">
        
        <div class="flex flex-col sm:flex-row justify-between items-center mb-8 gap-4 border-b-2 border-slate-800 pb-4">
            <h2 class="text-sm sm:text-base text-green-400 uppercase">
                PERSONAJES DE RICK AND MORTY
            </h2>
            <span id="user-display" class="text-[10px] text-yellow-400"></span>
        </div>

        <section id="personajes" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 p-4 bg-slate-900/50 border-2 border-slate-800 rounded-none shadow-[4px_4px_0_0_#020617]">

            <p class="text-[10px] text-slate-400 col-span-full text-center py-10">Cargando datos de la API...</p>
        </section>

    </main>

      <footer>
            
        <p class="text-[10px] text-slate-400 mt-4 text-center">
          &copy; 2024 Rick & Morty Portal. Todos los derechos reservados.
        </p>
      </footer>








</body>

    <script>
        let navContainer = document.getElementById("nav-container");
        let currentUser = JSON.parse(localStorage.getItem("currentUser"));

        if (currentUser) {
            // Si hay un usuario logueado, mostrar su nombre y un botón de cerrar sesión
            navContainer.innerHTML = `
                <span class="text-green-400 text-[10px]">Bienvenido, ${currentUser.username}</span>
                <button id="logout-btn" class="bg-red-500 hover:bg-red-400 text-slate-950 text-[10px] font-bold px-3 py-1 border-2 border-black shadow-[2px_2px_0_0_#fff] hover:shadow-[1px_1px_0_0_#fff] active:translate-x-1 active:translate-y-1 transition-all">
                    CERRAR SESIÓN
                </button>
                <a href="personajes.html" class="hover:text-green-400 p-2">PERSONAJES</a>
            `;

            document.getElementById("logout-btn").addEventListener("click", function() {
                localStorage.removeItem("currentUser");
                location.reload(); 
            });
        } else {
            
            navContainer.innerHTML = `
                <a href="register.html" class="hover:text-green-400 p-2">REGISTRO</a>
                <a href="login.html" class="hover:text-green-400 p-2">INGRESAR</a>
            `;
        }


    </script>

    <script src="personajes.js"></script>
</body>
</html>
