<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rick & Morty - Inicio Pixel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
   <style>
    body {
      font-family: 'Press Start 2P', cursive;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-green-500 selection:text-black">


  <header class="border-b-4 border-green-500 bg-slate-900 p-4 shadow-[0_4px_0_0_#15803d]">
    <div class="max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
      
   
      <div class="flex items-center gap-2">
        <span class="text-green-400 text-xl tracking-tighter">[R&M]</span>
        <h1 class="text-xs sm:text-sm text-green-400 tracking-wider">PORTAL_DB</h1>
      </div>

      
      <nav id="nav-container" class="flex flex-wrap items-center justify-center gap-3 text-[10px]">
        
       
       
      </nav>

    </div>
  </header>

  <!-- Hero / Pantalla de Inicio -->
  <main class="flex-1 flex flex-col items-center justify-center text-center px-4 py-12 max-w-4xl mx-auto">
    
    <!-- Contenedor con borde retro de bloques -->
    <div class="bg-slate-900 border-4 border-slate-700 p-6 sm:p-10 shadow-[8px_8px_0_0_#1e293b] relative">
      
      <!-- Detalle retro decorativo -->
      <div class="absolute -top-3 left-4 bg-green-500 text-black text-[9px] px-2 py-0.5 font-bold border-2 border-black">
        C-137 // ONLINE
      </div>

      <h2 class="text-lg sm:text-2xl text-green-400 mb-6 leading-relaxed uppercase">
        Base de Datos Multiversal
      </h2>

      <p class="text-[10px] sm:text-xs text-slate-300 leading-loose mb-8 max-w-xl mx-auto">
        Explora todos los sujetos del multiverso, guarda tus especímenes favoritos en tu cuenta local y asígnales puntuación de estrellas.
      </p>

      <!-- Botón Principal -->
      <div class="flex flex-col sm:flex-row justify-center gap-4 items-center">
        <button id="btn-explorar" class="w-full sm:w-auto bg-green-500 hover:bg-green-400 text-slate-950 text-xs font-bold px-6 py-4 border-4 border-black shadow-[4px_4px_0_0_#fff] hover:shadow-[2px_2px_0_0_#fff] active:translate-x-1 active:translate-y-1 transition-all">
          > VER PERSONAJES <
        </button>
      </div>

    </div>

  </main>

  <!-- Footer estilo consola -->
  <footer class="bg-slate-900 border-t-2 border-slate-800 p-4 text-center text-[9px] text-slate-500">
    <p>PRESS START TO PLAY - RICK & MORTY API CONSUMER v1.0</p>
  </footer>

  <script src="app.js"></script>
</body>


    <script>
        let navContainer = document.getElementById("nav-container");
        let currentUser = JSON.parse(localStorage.getItem("currentUser"));

        if (currentUser) {
            // Si hay un usuario logueado, mostrar su nombre y un botón de cerrar sesión
            navContainer.innerHTML = `
                <span class="text-green-400 text-[10px]">Bienvenido, ${currentUser.username}</span>
                <a href="personajes.html" class="hover:text-green-400 p-2">PERSONAJES</a>
                <button id="logout-btn" class="bg-red-500 hover:bg-red-400 text-slate-950 text-[10px] font-bold px-3 py-1 border-2 border-black shadow-[2px_2px_0_0_#fff] hover:shadow-[1px_1px_0_0_#fff] active:translate-x-1 active:translate-y-1 transition-all">
                    CERRAR SESIÓN
                </button>
                
            `;

            document.getElementById("logout-btn").addEventListener("click", function() {
                localStorage.removeItem("currentUser");
                location.reload(); 
            });
        } else {
            
            navContainer.innerHTML = `
                <a href="register.html" class="hover:text-green-400 p-2">REGISTRO</a>
                <a href="login.html" class="hover:text-green-400 p-2">INGRESAR</a>
            `;
        }


    </script>

</html>
